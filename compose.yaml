services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts/models:/app/artifacts/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
